<style>
:root{--paper:#EEF2EE;--sheet:#FAFBF9;--ink:#1F2421;--muted:#5E6B64;--line:#C9D3CC;--red:#C23B22;--jade:#3E6B5A}
@media (prefers-color-scheme: dark){:root{--paper:#171B19;--sheet:#202622;--ink:#E6ECE7;--muted:#9AA8A0;--line:#36403A;--red:#E0644A;--jade:#7FB49E}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font:16px -apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
form{width:100%;max-width:340px;background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:28px 20px 22px}
.mark{width:72px;height:72px;margin:0 auto 18px;border:1.5px solid var(--red);display:flex;align-items:center;justify-content:center;font:700 46px "Songti SC","Noto Serif SC",serif}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 6px}
input[type=text],input[type=password]{width:100%;font-size:16px;font-family:inherit;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);outline:none}
input:focus{border-color:var(--red)}
.row{display:flex;align-items:center;gap:8px;margin:16px 0 4px;font-size:15px}
button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:var(--jade);color:#fff;font-size:16px;font-weight:500;font-family:inherit;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:10px;text-align:center}
</style>

const d64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const e64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
async function openWith(key){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:d64(IV)},key,d64(CT));
  const html=new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
async function derive(login,pass){
  const enc=new TextEncoder(), s=d64(SALT), l=enc.encode(login);
  const salt=new Uint8Array(s.length+l.length); salt.set(s); salt.set(l,s.length);
  const base=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt,iterations:ITER},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
(async()=>{
